status:
  scope: >-
    The theorem to be formalized concerns elliptic curves over the rationals;
    it states that for any such `E`, and an integer `d` satisfying suitable conditions,
    there is a "large" set of Dirichlet characters `χ` of order exactly `d` such that
    the central L-value `L(E, χ, 1)` is non-zero. 
    
    We formalize this with two caveats:
    - Firstly, since one cannot even define the L-value without using modularity of elliptic 
      curves, and this modularity is not formalized yet, we _assume_ as part of the statement
      the existence of a modular form whose L-series matches that of `E`.
    - Secondly, since the proof of Kriz-Nordentoft relies on a theorem of Friedberg and Hoffstein 
      concerning non-vanishing _quadratic_ twists, which is also not formalized, we include the 
      existence of a suitable quadratic twist in the hypotheses of the theorem.
  # Count the proof development, excluding Challenge.lean's deliberate sorry.
  # Replace each count with an unquoted nonnegative integer, for example 0.
  sorry_count: 0
  sorry_in_definitions: 0
